[build]
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Sertakan views/ & public/ (hasil salinan prepare.js) ke dalam bundle function
  included_files = ["netlify/functions/_assets/**"]

[functions.esbuild]
  # ejs dibundle langsung oleh esbuild (server.js melakukan require('ejs')
  # secara statis + app.engine eksplisit), jadi tidak perlu eksternal
  external = ["pg", "pg-native", "pg-connection-string", "connect-pg-simple"]

# Arahkan semua URL ke aplikasi Express
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
